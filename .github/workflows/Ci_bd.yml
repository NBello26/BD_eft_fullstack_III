name: CI/CD Sanos y Salvos - DB

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-deploy-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR (runner)
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build imagen DB y push a ECR
        run: |
          docker build -t tienda_sanos-db .
          docker tag tienda_sanos-db:latest ${{ secrets.ECR_REPO_URL_DB }}:latest
          docker push ${{ secrets.ECR_REPO_URL_DB }}:latest

      - name: Desplegar DB vía SSM y esperar resultado
        run: |
            # 1. Enviamos el comando y capturamos el ID de la ejecución
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
              --document-name "AWS-RunShellScript" \
              --comment "Actualizar tienda-db desde ECR" \
              --parameters '{
                "commands":[
                  "set -e",
                  "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
                  "docker pull ${{ secrets.ECR_REPO_URL_DB }}:latest",
                  "docker stop tienda_sanos-db || true",
                  "docker rm tienda_sanos-db || true",
                  "docker volume rm pgdata || true", 
                  "docker run -d --name tienda_sanos-db -p 5432:5432 -e POSTGRES_PASSWORD=\"${{ secrets.DB_PASSWORD }}\" -e POSTGRES_USER=\"${{ secrets.DB_USER }}\" -e POSTGRES_DB=sanos_y_salvos_db -v pgdata:/var/lib/postgresql/data ${{ secrets.ECR_REPO_URL_DB }}:latest"
                ]
              }' \
              --query "Command.CommandId" \
              --output text)
            
            echo "Comando enviado con ID: $COMMAND_ID. Esperando a que termine en la EC2..."
            
            # 2. Obligamos al pipeline a esperar el resultado real en la máquina EC2
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_DB_INSTANCE_ID }}
              
            # 3. Mostrar los logs del comando (útil si algo falla)
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_DB_INSTANCE_ID }} \
              --query "StandardOutputContent" \
              --output text